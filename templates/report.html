{% extends "base.html" %} {% block css %}
<link
    rel="stylesheet"
    type="text/css"
    href="{{ url_for('static', path='css/report.css') }}"
/>
<title>Report</title>
{% endblock %} {% block content %}
<div style="text-align: center; padding: 24px 0 8px">
    <h1 style="margin-bottom: 4px">
        <i class="fa-solid fa-clipboard"></i> Buat Laporan
    </h1>
    <p
        style="
            color: var(--color-text-muted);
            font-size: 0.85rem;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        "
    >
        Sampaikan keluhan atau kejadian di lingkungan Anda
    </p>
    <div class="section-divider" style="margin-top: 12px"></div>
</div>

<div class="report-form-card">
    <h3>Detail Laporan</h3>

    <form method="post" action="/report">
        <div class="form-group">
            <label>Kategori Laporan</label>
            <div class="custom-select-wrapper">
                <select name="type" id="type-select" required>
                    <option value="" disabled selected>
                        — Pilih kategori —
                    </option>
                    <optgroup label="Infrastruktur">
                        <option value="Jalan Rusak">Jalan Rusak</option>
                        <option value="Saluran Air">
                            Saluran Air / Drainase
                        </option>
                        <option value="Penerangan Jalan">
                            Penerangan Jalan
                        </option>
                        <option value="Fasilitas Umum">Fasilitas Umum</option>
                    </optgroup>
                    <optgroup label="Sosial & Keamanan">
                        <option value="Keamanan">
                            Keamanan / Kriminalitas
                        </option>
                        <option value="Konflik Warga">
                            Konflik Antar Warga
                        </option>
                        <option value="Anak Terlantar">Anak Terlantar</option>
                    </optgroup>
                    <optgroup label="Lingkungan">
                        <option value="Sampah">Sampah / Kebersihan</option>
                        <option value="Banjir">Banjir / Genangan</option>
                        <option value="Pohon Tumbang">Pohon Tumbang</option>
                    </optgroup>
                    <optgroup label="Lainnya">
                        <option value="Lainnya">Lainnya</option>
                    </optgroup>
                </select>
            </div>
            <div id="type-preview" style="display: none; margin-top: 8px">
                <span id="type-pill"></span>
            </div>
        </div>

        <div class="form-group">
            <label>Deskripsi Kejadian</label>
            <textarea
                name="description"
                placeholder="Ceritakan secara lengkap apa yang terjadi, kapan, dan dampaknya..."
                required
                minlength="5"
                style="min-height: 120px"
            ></textarea>
        </div>

        <div class="form-group">
            <label>Lokasi Kejadian</label>
            <div class="input-with-icon">
                <span class="icon">📍</span>
                <textarea
                    name="location"
                    placeholder="Contoh: RT 03 / RW 01, Kampung Mekar, Kel. Sukamaju, Kec. Cimanggis"
                    required
                    minlength="5"
                    style="min-height: 80px"
                ></textarea>
            </div>
        </div>

        <button type="button" class="btn-post" onclick="handleSubmitReport()">
            <span></span><i class="fa-solid fa-paper-plane"></i> Kirim Laporan
        </button>
    </form>
</div>

{% endblock %}
