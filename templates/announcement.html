<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link
            rel="stylesheet"
            type="text/css"
            href="{{ url_for('static', path='css/main.css') }}"
        />
        <title>Announcements | Desa-Kita</title>
    </head>
    <body>
        <div class="nav-header">
            <a
                id="close-btn-ann"
                href="{{ 'admin' if role == 'admin' else 'dashboard' }}"
                >✖</a
            >
        </div>

        {% if role == "admin" %}
        <div class="card admin-form">
            <h3>Buat Pengumuman Baru</h3>
            <form method="post" action="/announcement">
                <input
                    name="title"
                    placeholder="Judul Pengumuman"
                    required
                    minlength="3"
                />

                <textarea
                    name="content"
                    placeholder="Isi Pengumuman..."
                    required
                    minlength="5"
                ></textarea>

                <div class="radio-group">
                    <label>
                        <input
                            type="radio"
                            name="priority"
                            value="penting"
                            required
                        />
                        <span class="label-penting">Penting</span>
                    </label>
                    <label>
                        <input type="radio" name="priority" value="umum" />
                        <span class="label-umum">Umum</span>
                    </label>
                </div>
                <button type="submit" class="btn-post">Posting</button>
            </form>
        </div>
        {% endif %}

        <div class="container">
            {% for ann in announcements %}
            <div
                class="card-ann {{ 'priority-penting' if ann.priority == 'penting' else 'priority-umum' }}"
            >
                <div class="content">
                    <span class="badge">{{ ann.priority | upper }}</span>
                    <h3>{{ ann.title }}</h3>
                    <p>{{ ann.content }}</p>
                    <hr />
                    <div class="meta">
                        <small
                            >Oleh <strong>{{ ann.author }}</strong> • {{
                            ann.created_at.strftime('%d %b %Y') }}</small
                        >

                        {% if role == "admin" %}
                        <form
                            method="post"
                            action="/announcement/delete/{{ ann.id }}"
                            style="display: inline"
                        >
                            <button
                                type="submit"
                                class="btn-delete"
                                onclick="
                                    return confirm('Hapus pengumuman ini?');
                                "
                            >
                                Hapus
                            </button>
                        </form>
                        {% endif %}
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </body>
</html>
