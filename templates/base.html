<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
        />
        <link
            rel="stylesheet"
            href="{{ url_for('static', path='css/menu.css') }}"
        />

        {% block css %} {% endblock %}

        <title>DesaKita</title>
    </head>

    <body>
        <button id="menu-btn">☰</button>

        <div id="sidebar" class="sidebar">
            <button id="close-btn">✖</button>

            <a href="{{ '/admin' if role == 'admin' else '/dashboard' }}">
                Home
            </a>

            <a href="/announcement"> Announcements </a>

            <button class="dropdown-btn">Report ▼</button>

            <div class="dropdown-content">
                <a href="/report">Buat Laporan</a>
                <a href="/report/laporan-saya">Laporan Saya</a>
            </div>

            <a href="#"> Settings </a>
        </div>

        <main>{% block content %} {% endblock %}</main>

        <script src="{{ url_for('static', path='js/main.js') }}"></script>

        {% block js %} {% endblock %}
    </body>
</html>
