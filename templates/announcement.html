<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta http-equiv="X-UA-Compatible" content="ie=edge" />
        <link
            rel="stylesheet"
            type="text/css"
            href="{{ url_for('static', path='css/main.css') }}"
        />
        <title>Announcement</title>
    </head>
    <body>
        {% for ann in announcements %}
        <div class="card">
            <div class="pfp"></div>

            <div class="content">
                <h3>{{ ann.title }}</h3>
                <p>{{ ann.content }}</p>
                <small>
                    By {{ ann.author }} • {{ ann.created_at.strftime('%d %b %Y,
                    %H:%M') }}
                </small>
            </div>
        </div>
        {% endfor %}
    </body>
</html>
